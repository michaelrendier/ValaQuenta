name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install ".[docs]"
      - name: Verify the arithmetic and the manifests
        working-directory: /tmp
        run: |
          python -c "import ValaQuenta, sys; print('ValaQuenta', ValaQuenta.__version__)"
          python -m ValaQuenta.engine.manifest validate | tail -1
          python -m ValaQuenta.engine.format validate | tail -1
      - name: Build the docs (warnings are errors)
        run: |
          python docs/gen_api.py
          git diff --exit-code docs/api || (echo "docs/api is stale: run python3 docs/gen_api.py" && exit 1)
          sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
