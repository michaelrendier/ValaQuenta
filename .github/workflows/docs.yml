name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install ".[docs,dev]"
      - name: Verify the arithmetic and the manifests
        working-directory: /tmp
        run: |
          python -c "import ValaQuenta, sys; print('ValaQuenta', ValaQuenta.__version__)"
          python -m ValaQuenta.engine.manifest validate | tail -1
          python -m ValaQuenta.engine.format validate | tail -1
      - name: Tests
        run: |
          pip install pytest
          python -m pytest -q
      - name: Build the docs (warnings are errors)
        run: |
          python docs/gen_api.py
          python docs/gen_listings.py
          git diff --exit-code docs/api docs/listings.rst || (echo "generated docs are stale: run python3 docs/gen_api.py docs/gen_listings.py" && exit 1)
          sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Add the interactive galleries and the code flow charts to the site
        run: |
          mkdir -p docs/_build/html/gallery docs/_build/html/docs
          cp -r gallery/t32_nilpotency docs/_build/html/gallery/
          cp -r gallery/hypergon_constructibility docs/_build/html/gallery/
          cp -r gallery/box_kite docs/_build/html/gallery/
          cp -r gallery/add_scale_sign docs/_build/html/gallery/
          cp -r gallery/bracketing_firing_order docs/_build/html/gallery/
          cp -r docs/flowcharts docs/_build/html/docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
