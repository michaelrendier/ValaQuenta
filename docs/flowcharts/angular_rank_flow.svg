<text x="490.0" y="481.1" font-size="10.8" fill="#16202c" text-anchor="middle">Embed one power spectrum into dim log-</text>
<text x="490.0" y="494.1" font-size="10.8" fill="#16202c" text-anchor="middle">spaced band energies.</text>
<rect x="364.0" y="527.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
