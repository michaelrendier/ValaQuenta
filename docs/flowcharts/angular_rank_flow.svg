<text x="490.0" y="571.6" font-size="10.8" fill="#16202c" text-anchor="middle">Test whether an object is a Datum.</text>
<rect x="364.0" y="611.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="633.6" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">null_occupancy_baseline</text>
<text x="490.0" y="649.1" font-size="10.8" fill="#16202c" text-anchor="middle">Compute the mandatory null for</text>
<text x="490.0" y="662.1" font-size="10.8" fill="#16202c" text-anchor="middle">null_occupancy.</text>
<rect x="364.0" y="695.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="717.6" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">sight</text>
<text x="490.0" y="733.1" font-size="10.8" fill="#16202c" text-anchor="middle">Take one guarded read against a held</text>
<text x="490.0" y="746.1" font-size="10.8" fill="#16202c" text-anchor="middle">datum: did the field move?</text>
<rect x="364.0" y="779.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="801.6" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">singular_spectrum</text>
<text x="490.0" y="817.1" font-size="10.8" fill="#16202c" text-anchor="middle">Return the singular values of the field,</text>
<text x="490.0" y="830.1" font-size="10.8" fill="#16202c" text-anchor="middle">descending.</text>
<rect x="364.0" y="863.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="885.6" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">verify_null_space</text>
<text x="490.0" y="901.1" font-size="10.8" fill="#16202c" text-anchor="middle">Reproduce the published {4, 8, 4} split</text>
<text x="490.0" y="914.1" font-size="10.8" fill="#16202c" text-anchor="middle">as a CHECK, not an inp…</text>
<rect x="364.0" y="947.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="969.6" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">angular_residual</text>
<text x="490.0" y="985.1" font-size="10.8" fill="#16202c" text-anchor="middle">Measure how much direction survives the</text>
<text x="490.0" y="998.1" font-size="10.8" fill="#16202c" text-anchor="middle">common mode. Phase 27.…</text>
<rect x="364.0" y="1031.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="1053.7" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">datum</text>
<text x="490.0" y="1069.2" font-size="10.8" fill="#16202c" text-anchor="middle">Freeze a field into a Datum. The only way</text>
<text x="490.0" y="1082.2" font-size="10.8" fill="#16202c" text-anchor="middle">into this module.</text>
<rect x="364.0" y="1115.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="1137.7" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">external_component</text>
<text x="490.0" y="1153.2" font-size="10.8" fill="#16202c" text-anchor="middle">Measure the energy of a signal outside a</text>
<text x="490.0" y="1166.2" font-size="10.8" fill="#16202c" text-anchor="middle">frozen internal span.</text>
<rect x="364.0" y="1199.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="1221.7" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">null_occupancy</text>
<text x="490.0" y="1237.2" font-size="10.8" fill="#16202c" text-anchor="middle">Measure what fraction of the field's</text>
<text x="490.0" y="1250.2" font-size="10.8" fill="#16202c" text-anchor="middle">energy lies in ker(L_a).</text>
<rect x="364.0" y="1283.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="1305.7" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">numerical_rank</text>
<text x="490.0" y="1321.2" font-size="10.8" fill="#16202c" text-anchor="middle">Compute numerical rank at a stated</text>
<text x="490.0" y="1334.2" font-size="10.8" fill="#16202c" text-anchor="middle">tolerance.</text>
<rect x="364.0" y="1367.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="1389.7" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">occupancy</text>
<text x="490.0" y="1405.2" font-size="10.8" fill="#16202c" text-anchor="middle">Report per-dimension energy fraction and</text>
<text x="490.0" y="1418.2" font-size="10.8" fill="#16202c" text-anchor="middle">participation ratio.</text>
<rect x="364.0" y="1451.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="1473.7" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">score_against_calibration</text>
<text x="490.0" y="1489.2" font-size="10.8" fill="#16202c" text-anchor="middle">Place a measured residual against the</text>
<text x="490.0" y="1502.2" font-size="10.8" fill="#16202c" text-anchor="middle">published Phase 27.2 ref…</text>
<rect x="364.0" y="1535.0" width="252" height="66" rx="33.0" fill="#cdebd6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="1557.7" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">Datum</text>
<text x="490.0" y="1573.2" font-size="10.8" fill="#16202c" text-anchor="middle">An immutable, content-stamped</text>
<text x="490.0" y="1586.2" font-size="10.8" fill="#16202c" text-anchor="middle">reference point for a field.</text>
<rect x="364.0" y="1619.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="1641.7" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">common_direction</text>
<text x="490.0" y="1657.2" font-size="10.8" fill="#16202c" text-anchor="middle">Return the mean unit direction -- the</text>
<text x="490.0" y="1670.2" font-size="10.8" fill="#16202c" text-anchor="middle">common mode, Phase 23's …</text>
<rect x="364.0" y="1703.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="1725.7" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">null_space</text>
<text x="490.0" y="1741.2" font-size="10.8" fill="#16202c" text-anchor="middle">Compute ker(L_a) -- the dimensions a</text>
<text x="490.0" y="1754.2" font-size="10.8" fill="#16202c" text-anchor="middle">annihilates.</text>
<rect x="364.0" y="1787.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="1809.7" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">orthonormal_span</text>
<text x="490.0" y="1825.2" font-size="10.8" fill="#16202c" text-anchor="middle">Return an orthonormal basis of the</text>
<text x="490.0" y="1838.2" font-size="10.8" fill="#16202c" text-anchor="middle">field's row space.</text>
<rect x="364.0" y="1871.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="1893.7" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">principal_angles</text>
<text x="490.0" y="1909.2" font-size="10.8" fill="#16202c" text-anchor="middle">Return principal angles between two</text>
<text x="490.0" y="1922.2" font-size="10.8" fill="#16202c" text-anchor="middle">orthonormal column spans.</text>
<rect x="364.0" y="1955.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="1977.7" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">left_mul_matrix</text>
<text x="490.0" y="1993.2" font-size="10.8" fill="#16202c" text-anchor="middle">Build the matrix L_a satisfying L_a v ==</text>
<text x="490.0" y="2006.2" font-size="10.8" fill="#16202c" text-anchor="middle">a * v.</text>
