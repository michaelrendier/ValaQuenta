<text x="790.0" y="220.2" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">basis_mul</text>
<text x="790.0" y="235.7" font-size="10.8" fill="#16202c" text-anchor="middle">ValaQuenta.modules.box_kite.maths</text>
