<text x="190.0" y="213.7" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">AngularRankModule</text>
<text x="190.0" y="229.2" font-size="10.8" fill="#16202c" text-anchor="middle">The 16D Oscilloscope -- angular</text>
<text x="190.0" y="242.2" font-size="10.8" fill="#16202c" text-anchor="middle">content and subspace occupancy.</text>
<rect x="364.0" y="275.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="297.6" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">angular_report</text>
<text x="490.0" y="313.1" font-size="10.8" fill="#16202c" text-anchor="middle">Produce the full stress-test card for one</text>
<text x="490.0" y="326.1" font-size="10.8" fill="#16202c" text-anchor="middle">field.</text>
<rect x="364.0" y="359.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="381.6" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">bearing</text>
<text x="490.0" y="397.1" font-size="10.8" fill="#16202c" text-anchor="middle">Measure how far a field's span moved</text>
<text x="490.0" y="410.1" font-size="10.8" fill="#16202c" text-anchor="middle">between two datums.</text>
<rect x="364.0" y="443.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
