<text x="490.0" y="304.1" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">bounds</text>
<text x="490.0" y="319.6" font-size="10.8" fill="#16202c" text-anchor="middle">Axis-aligned extent of an orbit.</text>
<rect x="364.0" y="359.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="381.6" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">cylindrical_rates</text>
<text x="490.0" y="397.1" font-size="10.8" fill="#16202c" text-anchor="middle">(dr/dt, dphi/dt) computed from the vector</text>
<text x="490.0" y="410.1" font-size="10.8" fill="#16202c" text-anchor="middle">field, and the close…</text>
<rect x="364.0" y="443.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="465.6" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">fixed_points</text>
<text x="490.0" y="481.1" font-size="10.8" fill="#16202c" text-anchor="middle">Fixed points sit on the axis (x = y = 0</text>
<text x="490.0" y="494.1" font-size="10.8" fill="#16202c" text-anchor="middle">because (z-b)^2 + d^2 …</text>
<rect x="364.0" y="527.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="549.6" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">js_layout</text>
<text x="490.0" y="565.1" font-size="10.8" fill="#16202c" text-anchor="middle">The animation page's buffer layout:</text>
<text x="490.0" y="578.1" font-size="10.8" fill="#16202c" text-anchor="middle">positions[3i] = x, [3i+1] …</text>
<rect x="364.0" y="611.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="633.6" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">lyapunov_max</text>
<text x="490.0" y="649.1" font-size="10.8" fill="#16202c" text-anchor="middle">Largest Lyapunov exponent by Benettin's</text>
<text x="490.0" y="662.1" font-size="10.8" fill="#16202c" text-anchor="middle">two-orbit method.</text>
<rect x="364.0" y="695.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="717.6" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">orbit</text>
<text x="490.0" y="733.1" font-size="10.8" fill="#16202c" text-anchor="middle">The orbit after the burn-in: array</text>
<text x="490.0" y="746.1" font-size="10.8" fill="#16202c" text-anchor="middle">(points, 3) of (x, y, z).</text>
<rect x="364.0" y="779.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="801.6" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">reduced_orbit</text>
<text x="490.0" y="817.1" font-size="10.8" fill="#16202c" text-anchor="middle">The 2-D (r, z) orbit of the axisymmetric</text>
<text x="490.0" y="830.1" font-size="10.8" fill="#16202c" text-anchor="middle">system (f = 0).</text>
<rect x="364.0" y="863.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="885.6" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">axisymmetric_rhs</text>
<text x="490.0" y="901.1" font-size="10.8" fill="#16202c" text-anchor="middle">With f = 0 the dynamics reduce to (r, z):</text>
<text x="490.0" y="914.1" font-size="10.8" fill="#16202c" text-anchor="middle">dr/dt = (z - b) r, …</text>
<rect x="364.0" y="947.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="969.6" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">rk4_step</text>
<text x="490.0" y="985.1" font-size="10.8" fill="#16202c" text-anchor="middle">One classical Runge-Kutta step (local</text>
<text x="490.0" y="998.1" font-size="10.8" fill="#16202c" text-anchor="middle">error O(h^5)).</text>
<rect x="364.0" y="1031.0" width="252" height="66" rx="4" fill="#dbe7f6" stroke="#3a4656" stroke-width="1.6"/>
<text x="490.0" y="1060.2" font-size="13.0" font-weight="700" fill="#16202c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">rhs</text>
<text x="490.0" y="1075.7" font-size="10.8" fill="#16202c" text-anchor="middle">The vector field at s = (x, y, z).</text>
<text x="40" y="1221" font-size="11.5" fill="#16202c">symbols (ISO 5807): oval = start/end · rectangle = step · diamond = decision · parallelogram = input/output · double-barred rectangle = sub-</text>
<text x="40" y="1236" font-size="11.5" fill="#16202c">process (another lane, or the other chart) · cylinder = stored data · every title is a name in the code</text>
